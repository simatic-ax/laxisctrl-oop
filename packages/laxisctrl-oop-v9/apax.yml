name: "@simatic-ax/laxisctrl-oop-v9"
version: 0.0.0-placeholder
type: lib
keywords:
  - library
author: Siemens AG
description: This library provides an Object-Oriented Programming (OOP) abstraction layer for SIMATIC S7-1500 and S7-1500T Motion Control within SIMATIC AX.

repository:
  type: git
  url: https://github.com/simatic-ax/laxisctrl-oop

registries:
  "@simatic-ax": https://npm.pkg.github.com/

publicKeys:
  "@simatic-ax":
    "v1": "3792a7e926775425ccdd29ceed8c368c3008b5b33d7d5550b3cb1f58093e1dff"
    "v2": "7af3e394eb2b285a3d99ab8e1f745cc6db75704b30a80393339c721a92ffffd9"

catalogs:
  "@ax-as/s7-catalog": ^2610.0.0
devDependencies:
  "@ax-as/s7-sdk": ^2610.0.2
dependencies:
  "@ax-mc/s7-motioncontrol-v9-lib": ^11.0.27

scripts:
  mk:release: apax make -p MakeConfigName:release
  mk:debug: apax make -p MakeConfigName:debug

files:
  - docs
  - bin/release
  - '!bin/release/lastused*'
  - LICENSE.md
  - README.md
